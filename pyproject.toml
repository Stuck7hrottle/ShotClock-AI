[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rof-from-video"
version = "0.2.0"
description = "Estimate rate of fire from video using audio-first shot detection with optional muzzle flash confirmation."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Your Name"}]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "typer>=0.12",
]

[project.optional-dependencies]
video = ["opencv-python>=4.8"]
ui = ["streamlit>=1.27", "pandas>=2.1"]
dev = ["pytest>=7.4", "ruff==0.16.8"]

[project.scripts]
rof = "rof_detector.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rof_detector = ["audio/model.json"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Ruff's own documented stable default (pyflakes + a handful of pycodestyle
# error checks). Made explicit and pinned alongside a fixed ruff version
# above so CI doesn't silently pick up newer default-on rule categories
# (pyupgrade, bugbear, tryceratops, ...) every time ruff ships a release --
# that's what caused CI to fail on unrelated code with no local repro.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
